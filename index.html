<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f8fb" />
    <meta name="description" content="Free, verified international live TV on your phone — cast to any Chromecast." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SmartTV+" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>SmartTV+ Cast</title>
    <script>
      // Apply the saved theme before first paint (no light/dark flash). Same logic as lib/theme.ts.
      (function () {
        try {
          var pref = localStorage.getItem('smarttv.theme') || 'system';
          var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0a0a1a' : '#f6f8fb');
        } catch (e) {}
      })();
      // Must exist before the Cast SDK loads. The app reads window.__castAvailable / listens for "cast-available".
      window.__onGCastApiAvailable = function (isAvailable) {
        window.__castAvailable = !!isAvailable;
        window.dispatchEvent(new CustomEvent('cast-available', { detail: !!isAvailable }));
      };
    </script>
    <script async src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
